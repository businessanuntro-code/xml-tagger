
<!DOCTYPE html>
<html lang="ro">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XML Tagger</title>

    <!-- =========================================================
         PDF.JS VIEWER CSS
         Este foarte important pentru pozitionarea corecta
         a TextLayer-ului si pentru selectia textului.
         ========================================================= -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/web/pdf_viewer.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f1f3f5;
            color: #222;
        }

        body {
            min-height: 100vh;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .header {
            background: #202124;
            color: white;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .header h1 {
            margin: 0;
            font-size: 21px;
            font-weight: 600;
        }

        .header-info {
            font-size: 13px;
            opacity: 0.8;
        }

        /* =====================================================
           MAIN LAYOUT
           ===================================================== */

        .main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 390px;
            height: calc(100vh - 57px);
            min-height: 650px;
        }

        /* =====================================================
           LEFT - PDF
           ===================================================== */

        .pdf-panel {
            min-width: 0;
            display: flex;
            flex-direction: column;
            background: #525659;
        }

        .pdf-toolbar {
            height: 50px;
            flex: 0 0 50px;

            background: #323639;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 8px;

            border-bottom: 1px solid #222;
        }

        .pdf-toolbar button {
            border: 0;
            background: #4a4f52;
            color: white;

            height: 32px;
            min-width: 34px;

            padding: 0 10px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 14px;
        }

        .pdf-toolbar button:hover {
            background: #5c6266;
        }

        .pdf-toolbar button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-number {
            font-size: 13px;
            min-width: 100px;
            text-align: center;
        }

        .zoom-label {
            min-width: 60px;
            text-align: center;
            font-size: 13px;
        }

        /* =====================================================
           PDF CONTAINER
           ===================================================== */

        #pdfContainer {
            flex: 1;
            overflow: auto;

            padding: 30px;

            position: relative;

            background:
                #525659;
        }

        /* =====================================================
           PDF PAGE
           ===================================================== */

        .pdf-page {
            position: relative;

            margin: 0 auto 30px auto;

            background: white;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.35);

            overflow: hidden;
        }

        /* =====================================================
           CANVAS

           IMPORTANT:
           CSS size = logical PDF size
           Canvas pixel size = logical size * DPR

           Astfel PDF-ul ramane clar pe monitoare HiDPI.
           ===================================================== */

        .pdf-page canvas.pdf-canvas {
            position: absolute;

            left: 0;
            top: 0;

            display: block;

            width: 100%;
            height: 100%;

            z-index: 1;
        }

        /* =====================================================
           PDF.JS TEXT LAYER

           NU pozitionam manual span-urile.

           PDF.js isi face singur:
           - transform
           - font-size
           - pozitionare
           - line height
           - selectie
           ===================================================== */

        .textLayer {
            position: absolute;

            left: 0;
            top: 0;

            right: 0;
            bottom: 0;

            z-index: 5;

            overflow: hidden;

            line-height: 1;

            text-size-adjust: none;
            forced-color-adjust: none;

            transform-origin: 0 0;

            user-select: text;
            -webkit-user-select: text;
        }

        /*
         * Textul PDF.js trebuie sa fie invizibil vizual,
         * dar sa ramana selectabil.
         *
         * NU modificam transform-ul sau pozitionarea span-urilor.
         */

        .textLayer span {
            color: transparent !important;

            background: transparent !important;

            -webkit-text-fill-color: transparent !important;
        }

        /*
         * Selectia ramane vizibila.
         */

        .textLayer ::selection {
            background: rgba(0, 120, 255, 0.35);
        }

        /* =====================================================
           RIGHT PANEL
           ===================================================== */

        .side-panel {
            background: white;

            border-left: 1px solid #ccc;

            display: flex;
            flex-direction: column;

            min-width: 0;

            overflow: hidden;
        }

        /* =====================================================
           UPLOAD
           ===================================================== */

        .upload-section {
            padding: 15px;

            border-bottom: 1px solid #ddd;

            background: #fafafa;
        }

        .upload-section h2 {
            margin: 0 0 10px 0;

            font-size: 16px;
        }

        .upload-form {
            display: flex;
            flex-direction: column;

            gap: 8px;
        }

        .upload-form input[type="file"] {
            width: 100%;
        }

        .upload-button {
            border: 0;

            background: #1976d2;
            color: white;

            padding: 9px 12px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 14px;
        }

        .upload-button:hover {
            background: #1565c0;
        }

        /* =====================================================
           SELECTED TEXT
           ===================================================== */

        .selection-section {
            padding: 15px;

            border-bottom: 1px solid #ddd;
        }

        .selection-section h2 {
            margin: 0 0 8px 0;

            font-size: 15px;
        }

        #selectedText {
            width: 100%;

            min-height: 90px;

            resize: vertical;

            border: 1px solid #ccc;

            border-radius: 4px;

            padding: 8px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 13px;

            line-height: 1.4;

            background: #f8f9fa;
        }

        .selection-info {
            margin-top: 7px;

            font-size: 12px;

            color: #666;

            min-height: 16px;
        }

        /* =====================================================
           TAGS
           ===================================================== */

        .tags-section {
            padding: 15px;

            border-bottom: 1px solid #ddd;

            overflow-y: auto;

            max-height: 280px;
        }

        .tags-section h2 {
            margin: 0 0 10px 0;

            font-size: 15px;
        }

        .tag-grid {
            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 6px;
        }

        .tag-button {
            border: 1px solid #bbb;

            background: #f7f7f7;

            color: #222;

            border-radius: 4px;

            padding: 8px 6px;

            cursor: pointer;

            font-size: 12px;

            text-align: left;
        }

        .tag-button:hover {
            background: #e9ecef;
        }

        .tag-button:active {
            background: #dee2e6;
        }

        /* =====================================================
           TAGGED ITEMS
           ===================================================== */

        .items-section {
            flex: 1;

            min-height: 0;

            display: flex;

            flex-direction: column;

            padding: 15px;
        }

        .items-section h2 {
            margin: 0 0 10px 0;

            font-size: 15px;
        }

        #taggedItems {
            flex: 1;

            min-height: 0;

            overflow-y: auto;

            border: 1px solid #ddd;

            border-radius: 4px;

            background: #fafafa;
        }

        .tagged-item {
            padding: 9px;

            border-bottom: 1px solid #ddd;

            background: white;
        }

        .tagged-item:last-child {
            border-bottom: 0;
        }

        .tagged-item-header {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 8px;

            margin-bottom: 5px;
        }

        .tag-name {
            font-weight: bold;

            font-size: 12px;

            color: #1976d2;
        }

        .tagged-item-text {
            font-size: 12px;

            line-height: 1.35;

            color: #333;

            white-space: pre-wrap;

            word-break: break-word;
        }

        .item-buttons {
            display: flex;

            gap: 3px;
        }

        .item-buttons button {
            border: 0;

            background: #e9ecef;

            cursor: pointer;

            border-radius: 3px;

            width: 25px;

            height: 23px;

            font-size: 12px;
        }

        .item-buttons button:hover {
            background: #d6d9dc;
        }

        .empty-items {
            padding: 20px;

            text-align: center;

            color: #777;

            font-size: 13px;
        }

        /* =====================================================
           XML
           ===================================================== */

        .xml-section {
            border-top: 1px solid #ccc;

            padding: 15px;

            background: #fafafa;
        }

        .xml-section h2 {
            margin: 0 0 8px 0;

            font-size: 15px;
        }

        #xmlPreview {
            width: 100%;

            height: 220px;

            resize: vertical;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            font-size: 11px;

            line-height: 1.4;

            border: 1px solid #ccc;

            border-radius: 4px;

            padding: 8px;

            background: white;
        }

        .xml-buttons {
            display: flex;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 8px;
        }

        .xml-buttons button {
            border: 0;

            background: #495057;

            color: white;

            padding: 8px 10px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 12px;
        }

        .xml-buttons button:hover {
            background: #343a40;
        }

        /* =====================================================
           STATUS
           ===================================================== */

        #status {
            position: fixed;

            left: 15px;
            bottom: 15px;

            background: rgba(0, 0, 0, 0.82);

            color: white;

            padding: 9px 12px;

            border-radius: 4px;

            font-size: 12px;

            z-index: 10000;

            display: none;

            max-width: 400px;
        }

        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 1000px) {

            .main {
                grid-template-columns:
                    minmax(0, 1fr)
                    330px;
            }

        }

        @media (max-width: 800px) {

            .main {
                grid-template-columns: 1fr;

                height: auto;
            }

            .pdf-panel {
                height: 70vh;

                min-height: 500px;
            }

            .side-panel {
                border-left: 0;

                border-top: 1px solid #ccc;
            }

        }

    </style>
</head>


<body>

    <!-- =========================================================
         PDF.JS
         ========================================================= -->

    <script type="module">

        import * as pdfjsLib from
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.min.mjs";


        /*
         * Worker PDF.js
         */

        pdfjsLib.GlobalWorkerOptions.workerSrc =
            "https://cdn.jsdelivr.net/npm/pdfjs-dist@6.2.108/build/pdf.worker.min.mjs";


        /* =====================================================
           ELEMENTS
           ===================================================== */

        const uploadForm =
            document.getElementById(
                "uploadForm"
            );

        const pdfFile =
            document.getElementById(
                "pdfFile"
            );

        const pdfContainer =
            document.getElementById(
                "pdfContainer"
            );

        const selectedText =
            document.getElementById(
                "selectedText"
            );

        const selectionInfo =
            document.getElementById(
                "selectionInfo"
            );

        const taggedItems =
            document.getElementById(
                "taggedItems"
            );

        const xmlPreview =
            document.getElementById(
                "xmlPreview"
            );

        const statusBox =
            document.getElementById(
                "status"
            );

        const prevPage =
            document.getElementById(
                "prevPage"
            );

        const nextPage =
            document.getElementById(
                "nextPage"
            );

        const pageNumber =
            document.getElementById(
                "pageNumber"
            );

        const zoomIn =
            document.getElementById(
                "zoomIn"
            );

        const zoomOut =
            document.getElementById(
                "zoomOut"
            );

        const zoomReset =
            document.getElementById(
                "zoomReset"
            );

        const zoomLabel =
            document.getElementById(
                "zoomLabel"
            );

        const copyXml =
            document.getElementById(
                "copyXml"
            );

        const downloadXml =
            document.getElementById(
                "downloadXml"
            );

        const clearAll =
            document.getElementById(
                "clearAll"
            );


        /* =====================================================
           STATE
           ===================================================== */

        let pdfDocument = null;

        let currentPage = 1;

        let scale = 1.0;

        let taggedData = [];

        let currentPdfUrl = null;


        /*
         * Text selection state.
         *
         * Pastram Range-ul pentru ca utilizatorul sa poata:
         *
         * 1. selecta textul
         * 2. apasa tag
         *
         * fara sa pierdem selectia.
         */

        let savedSelection = null;


        /* =====================================================
           STATUS
           ===================================================== */

        function showStatus(
            message,
            duration = 2500
        ) {

            statusBox.textContent =
                message;

            statusBox.style.display =
                "block";

            clearTimeout(
                showStatus.timer
            );

            showStatus.timer =
                setTimeout(
                    function() {

                        statusBox.style.display =
                            "none";

                    },
                    duration
                );
        }


        /* =====================================================
           XML ESCAPE
           ===================================================== */

        function escapeXml(
            value
        ) {

            return String(value)
                .replace(
                    /&/g,
                    "&amp;"
                )
                .replace(
                    /</g,
                    "&lt;"
                )
                .replace(
                    />/g,
                    "&gt;"
                )
                .replace(
                    /"/g,
                    "&quot;"
                )
                .replace(
                    /'/g,
                    "&apos;"
                );

        }


        /* =====================================================
           NORMALIZE SELECTED TEXT
           
           Doar eliminam spatii inutile la inceput/sfarsit.
           
           NU reconstruim textul din TextItem-uri.
           ===================================================== */

        function cleanSelectedText(
            text
        ) {

            return String(text || "")
                .replace(
                    /\u00a0/g,
                    " "
                )
                .replace(
                    /\r\n/g,
                    "\n"
                )
                .replace(
                    /\r/g,
                    "\n"
                )
                .replace(
                    /[ \t]+\n/g,
                    "\n"
                )
                .replace(
                    /\n[ \t]+/g,
                    "\n"
                )
                .trim();

        }


        /* =====================================================
           FIND PDF PAGE FROM SELECTION
           ===================================================== */

        function getSelectionPage(
            range
        ) {

            let node =
                range.commonAncestorContainer;

            if (
                node.nodeType ===
                Node.TEXT_NODE
            ) {
                node =
                    node.parentElement;
            }

            if (
                node &&
                node.closest
            ) {

                const page =
                    node.closest(
                        ".pdf-page"
                    );

                if (page) {

                    const pageNumberValue =
                        Number(
                            page.dataset.pageNumber
                        );

                    if (
                        Number.isFinite(
                            pageNumberValue
                        )
                    ) {
                        return pageNumberValue;
                    }

                }

            }

            /*
             * Incercam si cu startContainer.
             */

            let startNode =
                range.startContainer;

            if (
                startNode.nodeType ===
                Node.TEXT_NODE
            ) {
                startNode =
                    startNode.parentElement;
            }

            if (
                startNode &&
                startNode.closest
            ) {

                const page =
                    startNode.closest(
                        ".pdf-page"
                    );

                if (page) {

                    return Number(
                        page.dataset.pageNumber
                    );

                }

            }

            return null;

        }


        /* =====================================================
           SAVE CURRENT SELECTION
           ===================================================== */

        function saveCurrentSelection() {

            const selection =
                window.getSelection();

            if (
                !selection ||
                selection.rangeCount === 0 ||
                selection.isCollapsed
            ) {

                return null;

            }

            const range =
                selection.getRangeAt(0);

            /*
             * Verificam ca selectia sa fie
             * efectiv in text layer.
             */

            let container =
                range.commonAncestorContainer;

            if (
                container.nodeType ===
                Node.TEXT_NODE
            ) {
                container =
                    container.parentElement;
            }

            if (
                !container ||
                !container.closest
            ) {

                return null;

            }

            const textLayer =
                container.closest(
                    ".textLayer"
                );

            if (!textLayer) {

                return null;

            }

            const text =
                cleanSelectedText(
                    selection.toString()
                );

            if (!text) {

                return null;

            }

            const page =
                getSelectionPage(
                    range
                );

            savedSelection = {
                text: text,
                page: page,
                range: range.cloneRange()
            };

            return savedSelection;

        }


        /* =====================================================
           SELECTION CHANGE
           ===================================================== */

        document.addEventListener(
            "selectionchange",
            function() {

                const selection =
                    window.getSelection();

                if (
                    !selection ||
                    selection.rangeCount === 0 ||
                    selection.isCollapsed
                ) {

                    return;

                }

                const range =
                    selection.getRangeAt(0);

                let node =
                    range.commonAncestorContainer;

                if (
                    node.nodeType ===
                    Node.TEXT_NODE
                ) {

                    node =
                        node.parentElement;

                }

                if (
                    !node ||
                    !node.closest
                ) {

                    return;

                }

                const textLayer =
                    node.closest(
                        ".textLayer"
                    );

                if (!textLayer) {

                    return;

                }

                const text =
                    cleanSelectedText(
                        selection.toString()
                    );

                if (!text) {

                    return;

                }

                const page =
                    getSelectionPage(
                        range
                    );

                savedSelection = {
                    text: text,
                    page: page,
                    range: range.cloneRange()
                };

                selectedText.value =
                    text;

                if (page) {

                    selectionInfo.textContent =
                        "Pagina " +
                        page +
                        " · Text selectat direct din PDF";

                } else {

                    selectionInfo.textContent =
                        "Text selectat direct din PDF";

                }

            }
        );


        /* =====================================================
           MOUSEUP

           Important:
           nu modificam selectia.

           Doar citim selectia creata de browser.
           ===================================================== */

        document.addEventListener(
            "mouseup",
            function(event) {

                if (
                    !pdfContainer.contains(
                        event.target
                    )
                ) {

                    return;

                }

                setTimeout(
                    function() {

                        saveCurrentSelection();

                    },
                    10
                );

            }
        );


        /* =====================================================
           RENDER PAGE
           ===================================================== */

        async function renderPage(
            pageNumberValue
        ) {

            if (!pdfDocument) {

                return;

            }

            const page =
                await pdfDocument.getPage(
                    pageNumberValue
                );


            /*
             * Viewport logic.
             */

            const viewport =
                page.getViewport({
                    scale: scale
                });


            /*
             * devicePixelRatio este esential
             * pentru claritate pe monitoare moderne.
             */

            const devicePixelRatio =
                window.devicePixelRatio ||
                1;


            /*
             * Container pagina.
             */

            pdfContainer.innerHTML =
                "";


            const pageDiv =
                document.createElement(
                    "div"
                );

            pageDiv.className =
                "pdf-page";

            pageDiv.dataset.pageNumber =
                String(
                    pageNumberValue
                );

            pageDiv.style.width =
                viewport.width +
                "px";

            pageDiv.style.height =
                viewport.height +
                "px";


            /*
             * Canvas.
             */

            const canvas =
                document.createElement(
                    "canvas"
                );

            canvas.className =
                "pdf-canvas";


            const context =
                canvas.getContext(
                    "2d",
                    {
                        alpha: false
                    }
                );


            /*
             * IMPORTANT:
             *
             * Canvas intern este mai mare,
             * dar dimensiunea CSS ramane viewport.
             *
             * Rezultatul:
             * PDF mult mai clar.
             */

            canvas.width =
                Math.floor(
                    viewport.width *
                    devicePixelRatio
                );

            canvas.height =
                Math.floor(
                    viewport.height *
                    devicePixelRatio
                );

            canvas.style.width =
                viewport.width +
                "px";

            canvas.style.height =
                viewport.height +
                "px";


            pageDiv.appendChild(
                canvas
            );


            /*
             * Text layer.
             */

            const textLayerDiv =
                document.createElement(
                    "div"
                );

            textLayerDiv.className =
                "textLayer";


            textLayerDiv.style.width =
                viewport.width +
                "px";

            textLayerDiv.style.height =
                viewport.height +
                "px";


            pageDiv.appendChild(
                textLayerDiv
            );


            pdfContainer.appendChild(
                pageDiv
            );


            /*
             * Randare PDF.
             */

            const renderContext = {

                canvasContext:
                    context,

                viewport:
                    viewport,

                transform:
                    devicePixelRatio !== 1
                        ? [
                            devicePixelRatio,
                            0,
                            0,
                            devicePixelRatio,
                            0,
                            0
                        ]
                        : null

            };


            await page.render(
                renderContext
            ).promise;


            /*
             * Text content.
             */

            const textContent =
                await page.getTextContent({
                    includeMarkedContent:
                        false
                });


            /*
             * Native PDF.js TextLayer.
             */

            const textLayer =
                new pdfjsLib.TextLayer({

                    textContentSource:
                        textContent,

                    container:
                        textLayerDiv,

                    viewport:
                        viewport

                });


            await textLayer.render();


            /*
             * Update UI.
             */

            pageNumber.textContent =
                "Pagina " +
                pageNumberValue +
                " / " +
                pdfDocument.numPages;


            zoomLabel.textContent =
                Math.round(
                    scale * 100
                ) +
                "%";


            prevPage.disabled =
                pageNumberValue <= 1;

            nextPage.disabled =
                pageNumberValue >=
                pdfDocument.numPages;

        }


        /* =====================================================
           LOAD PDF
           ===================================================== */

        async function loadPdf(
            url
        ) {

            try {

                showStatus(
                    "Se încarcă PDF-ul...",
                    5000
                );


                /*
                 * Resetam selectia.
                 */

                savedSelection =
                    null;

                selectedText.value =
                    "";

                selectionInfo.textContent =
                    "Selectează text din PDF.";


                /*
                 * PDF.js loading.
                 */

                const loadingTask =
                    pdfjsLib.getDocument({
                        url: url
                    });


                pdfDocument =
                    await loadingTask.promise;


                currentPage =
                    1;

                scale =
                    1.0;


                await renderPage(
                    currentPage
                );


                showStatus(
                    "PDF încărcat.",
                    1800
                );

            }
            catch (error) {

                console.error(
                    error
                );

                showStatus(
                    "Eroare la încărcarea PDF-ului: " +
                    error.message,
                    5000
                );

            }

        }


        /* =====================================================
           UPLOAD
           ===================================================== */

        uploadForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                if (
                    !pdfFile.files ||
                    !pdfFile.files.length
                ) {

                    showStatus(
                        "Selectează un fișier PDF.",
                        3000
                    );

                    return;

                }


                const file =
                    pdfFile.files[0];


                if (
                    !file.name
                        .toLowerCase()
                        .endsWith(".pdf")
                ) {

                    showStatus(
                        "Este permis doar formatul PDF.",
                        3000
                    );

                    return;

                }


                const formData =
                    new FormData();

                formData.append(
                    "file",
                    file
                );


                try {

                    showStatus(
                        "Se încarcă PDF-ul...",
                        5000
                    );


                    const response =
                        await fetch(
                            "/upload",
                            {
                                method: "POST",
                                body: formData
                            }
                        );


                    const data =
                        await response.json();


                    if (
                        !response.ok
                    ) {

                        throw new Error(
                            data.detail ||
                            "Upload eșuat."
                        );

                    }


                    currentPdfUrl =
                        data.url;


                    await loadPdf(
                        data.url
                    );

                }
                catch (error) {

                    console.error(
                        error
                    );

                    showStatus(
                        "Eroare upload: " +
                        error.message,
                        5000
                    );

                }

            }
        );


        /* =====================================================
           PAGE NAVIGATION
           ===================================================== */

        prevPage.addEventListener(
            "click",
            async function() {

                if (
                    !pdfDocument ||
                    currentPage <= 1
                ) {

                    return;

                }

                currentPage--;

                await renderPage(
                    currentPage
                );

            }
        );


        nextPage.addEventListener(
            "click",
            async function() {

                if (
                    !pdfDocument ||
                    currentPage >=
                    pdfDocument.numPages
                ) {

                    return;

                }

                currentPage++;

                await renderPage(
                    currentPage
                );

            }
        );


        /* =====================================================
           ZOOM
           ===================================================== */

        zoomIn.addEventListener(
            "click",
            async function() {

                if (!pdfDocument) {

                    return;

                }

                scale =
                    Math.min(
                        scale + 0.1,
                        3.0
                    );

                await renderPage(
                    currentPage
                );

            }
        );


        zoomOut.addEventListener(
            "click",
            async function() {

                if (!pdfDocument) {

                    return;

                }

                scale =
                    Math.max(
                        scale - 0.1,
                        0.5
                    );

                await renderPage(
                    currentPage
                );

            }
        );


        zoomReset.addEventListener(
            "click",
            async function() {

                if (!pdfDocument) {

                    return;

                }

                scale =
                    1.0;

                await renderPage(
                    currentPage
                );

            }
        );


        /* =====================================================
           ADD TAG
           ===================================================== */

        function addTaggedItem(
            tag
        ) {

            /*
             * Incercam sa pastram selectia.
             */

            let text = "";

            let page = null;


            if (savedSelection) {

                text =
                    cleanSelectedText(
                        savedSelection.text
                    );

                page =
                    savedSelection.page;

            }


            /*
             * Fallback:
             * citim direct din textarea.
             */

            if (!text) {

                text =
                    cleanSelectedText(
                        selectedText.value
                    );

            }


            if (!text) {

                showStatus(
                    "Selectează mai întâi textul din PDF.",
                    3000
                );

                return;

            }


            /*
             * Adaugam elementul.
             */

            taggedData.push({

                tag:
                    tag,

                text:
                    text,

                page:
                    page

            });


            /*
             * Curatam selectia dupa tagging.
             */

            selectedText.value =
                "";

            selectionInfo.textContent =
                "Element adăugat: <" +
                tag +
                ">";


            savedSelection =
                null;


            renderTaggedItems();

            generateXml();


            /*
             * Incercam sa eliminam
             * selectia vizuala.
             */

            const selection =
                window.getSelection();

            if (selection) {

                selection.removeAllRanges();

            }

        }


        /* =====================================================
           TAG BUTTONS
           ===================================================== */

        document
            .querySelectorAll(
                ".tag-button"
            )
            .forEach(
                function(button) {

                    button.addEventListener(
                        "click",
                        function() {

                            const tag =
                                button.dataset.tag;

                            addTaggedItem(
                                tag
                            );

                        }
                    );

                }
            );


        /* =====================================================
           RENDER TAGGED ITEMS
           ===================================================== */

        function renderTaggedItems() {

            taggedItems.innerHTML =
                "";


            if (
                taggedData.length === 0
            ) {

                const empty =
                    document.createElement(
                        "div"
                    );

                empty.className =
                    "empty-items";

                empty.textContent =
                    "Nu există încă elemente taguite.";

                taggedItems.appendChild(
                    empty
                );

                return;

            }


            taggedData.forEach(
                function(item, index) {

                    const wrapper =
                        document.createElement(
                            "div"
                        );

                    wrapper.className =
                        "tagged-item";


                    const header =
                        document.createElement(
                            "div"
                        );

                    header.className =
                        "tagged-item-header";


                    const tagName =
                        document.createElement(
                            "div"
                        );

                    tagName.className =
                        "tag-name";

                    tagName.textContent =
                        "<" +
                        item.tag +
                        ">";


                    const buttons =
                        document.createElement(
                            "div"
                        );

                    buttons.className =
                        "item-buttons";


                    /*
                     * UP
                     */

                    const upButton =
                        document.createElement(
                            "button"
                        );

                    upButton.type =
                        "button";

                    upButton.textContent =
                        "↑";

                    upButton.title =
                        "Mută în sus";

                    upButton.disabled =
                        index === 0;

                    upButton.addEventListener(
                        "click",
                        function() {

                            if (
                                index <= 0
                            ) {

                                return;

                            }

                            const temp =
                                taggedData[
                                    index - 1
                                ];

                            taggedData[
                                index - 1
                            ] =
                                taggedData[
                                    index
                                ];

                            taggedData[index] =
                                temp;


                            renderTaggedItems();

                            generateXml();

                        }
                    );


                    /*
                     * DOWN
                     */

                    const downButton =
                        document.createElement(
                            "button"
                        );

                    downButton.type =
                        "button";

                    downButton.textContent =
                        "↓";

                    downButton.title =
                        "Mută în jos";

                    downButton.disabled =
                        index ===
                        taggedData.length - 1;

                    downButton.addEventListener(
                        "click",
                        function() {

                            if (
                                index >=
                                taggedData.length - 1
                            ) {

                                return;

                            }

                            const temp =
                                taggedData[
                                    index + 1
                                ];

                            taggedData[
                                index + 1
                            ] =
                                taggedData[
                                    index
                                ];

                            taggedData[index] =
                                temp;


                            renderTaggedItems();

                            generateXml();

                        }
                    );


                    /*
                     * DELETE
                     */

                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.type =
                        "button";

                    deleteButton.textContent =
                        "×";

                    deleteButton.title =
                        "Șterge";

                    deleteButton.addEventListener(
                        "click",
                        function() {

                            taggedData.splice(
                                index,
                                1
                            );

                            renderTaggedItems();

                            generateXml();

                        }
                    );


                    buttons.appendChild(
                        upButton
                    );

                    buttons.appendChild(
                        downButton
                    );

                    buttons.appendChild(
                        deleteButton
                    );


                    header.appendChild(
                        tagName
                    );

                    header.appendChild(
                        buttons
                    );


                    const text =
                        document.createElement(
                            "div"
                        );

                    text.className =
                        "tagged-item-text";

                    text.textContent =
                        item.text;


                    wrapper.appendChild(
                        header
                    );

                    wrapper.appendChild(
                        text
                    );


                    taggedItems.appendChild(
                        wrapper
                    );

                }
            );

        }


        /* =====================================================
           GENERATE XML
           ===================================================== */

        function generateXml() {

            let xml =
                '<?xml version="1.0" encoding="UTF-8"?>\n';

            xml +=
                "<TaggedPDF-doc>\n";

            xml +=
                "  <Document>\n";

            xml +=
                "    <Article>\n";


            /*
             * Pentru moment pastram fiecare tag
             * intr-un Story separat.
             *
             * Structura poate fi rafinata ulterior
             * dupa regulile exacte ale XML-ului final.
             */

            taggedData.forEach(
                function(item) {

                    xml +=
                        "      <Story>\n";

                    xml +=
                        "        <" +
                        item.tag +
                        ">";

                    xml +=
                        escapeXml(
                            item.text
                        );

                    xml +=
                        "</" +
                        item.tag +
                        ">\n";

                    xml +=
                        "      </Story>\n";

                }
            );


            xml +=
                "    </Article>\n";

            xml +=
                "  </Document>\n";

            xml +=
                "</TaggedPDF-doc>";


            xmlPreview.value =
                xml;

        }


        /* =====================================================
           COPY XML
           ===================================================== */

        copyXml.addEventListener(
            "click",
            async function() {

                try {

                    await navigator.clipboard.writeText(
                        xmlPreview.value
                    );

                    showStatus(
                        "XML copiat.",
                        1800
                    );

                }
                catch (error) {

                    xmlPreview.select();

                    document.execCommand(
                        "copy"
                    );

                    showStatus(
                        "XML copiat.",
                        1800
                    );

                }

            }
        );


        /* =====================================================
           DOWNLOAD XML
           ===================================================== */

        downloadXml.addEventListener(
            "click",
            function() {

                const xml =
                    xmlPreview.value;


                if (!xml.trim()) {

                    showStatus(
                        "Nu există XML de descărcat.",
                        2500
                    );

                    return;

                }


                const blob =
                    new Blob(
                        [xml],
                        {
                            type:
                                "application/xml;charset=utf-8"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );

                link.href =
                    url;

                link.download =
                    "document.xml";


                document.body.appendChild(
                    link
                );

                link.click();

                link.remove();


                URL.revokeObjectURL(
                    url
                );

            }
        );


        /* =====================================================
           CLEAR ALL
           ===================================================== */

        clearAll.addEventListener(
            "click",
            function() {

                if (
                    taggedData.length === 0
                ) {

                    return;

                }


                if (
                    !confirm(
                        "Sigur vrei să ștergi toate elementele taguite?"
                    )
                ) {

                    return;

                }


                taggedData =
                    [];


                selectedText.value =
                    "";

                selectionInfo.textContent =
                    "Selectează text din PDF.";


                savedSelection =
                    null;


                renderTaggedItems();

                generateXml();


                const selection =
                    window.getSelection();

                if (selection) {

                    selection.removeAllRanges();

                }


                showStatus(
                    "Elementele au fost șterse.",
                    1800
                );

            }
        );


        /* =====================================================
           INITIAL STATE
           ===================================================== */

        renderTaggedItems();

        generateXml();


        /*
         * Daca utilizatorul redimensioneaza fereastra,
         * randam din nou pagina la DPR-ul actual.
         *
         * Debounce pentru a evita randari continue.
         */

        let resizeTimer = null;

        window.addEventListener(
            "resize",
            function() {

                clearTimeout(
                    resizeTimer
                );

                resizeTimer =
                    setTimeout(
                        async function() {

                            if (
                                pdfDocument
                            ) {

                                await renderPage(
                                    currentPage
                                );

                            }

                        },
                        250
                    );

            }
        );

    </script>

</body>
