<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XML Tagger</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: #e9edf2;
        }

        body {
            overflow: hidden;
        }


        /* ==================================================
           TOPBAR
        ================================================== */

        .topbar {
            height: 64px;
            background: #1f2937;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 18px;

            gap: 20px;
        }

        .topbar-title {
            font-size: 20px;
            font-weight: 700;
        }

        .topbar-subtitle {
            font-size: 13px;
            opacity: 0.7;
        }


        /* ==================================================
           LAYOUT
        ================================================== */

        .app {
            height: calc(100vh - 64px);

            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                390px;
        }


        /* ==================================================
           LEFT
        ================================================== */

        .left-panel {
            min-width: 0;

            display: flex;
            flex-direction: column;

            background: #d8dde4;
        }

        .document-toolbar {

            min-height: 52px;

            background: white;

            border-bottom: 1px solid #c7cdd5;

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 8px 12px;
        }

        .document-toolbar button,
        .upload-label {

            border: 1px solid #c4cbd4;

            background: white;

            border-radius: 6px;

            padding: 8px 13px;

            cursor: pointer;

            font-size: 13px;
        }

        .document-toolbar button:hover,
        .upload-label:hover {
            background: #f1f3f5;
        }

        #pdfFile {
            display: none;
        }

        .file-name {
            font-size: 13px;
            color: #555;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }


        /* ==================================================
           PDF VIEWER
        ================================================== */

        .pdf-viewer {

            flex: 1;

            overflow: auto;

            padding: 30px;

            text-align: center;

            background:
                #cfd5dc;
        }

        .pdf-empty {

            height: 100%;

            display: flex;

            align-items: center;

            justify-content: center;

            color: #697586;

            font-size: 16px;
        }


        /* ==================================================
           PAGE
        ================================================== */

        .pdf-page {

            position: relative;

            display: block;

            margin: 0 auto 30px auto;

            background: white;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.22);

            overflow: hidden;

            text-align: left;
        }


        /* ==================================================
           PAGE IMAGE
        ================================================== */

        .pdf-page-image {

            display: block;

            width: 100%;

            height: auto;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* ==================================================
           TEXT LAYER
        ================================================== */

        .pdf-text-layer {

            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            overflow: hidden;

            user-select: text;

            -webkit-user-select: text;

            pointer-events: auto;
        }


        .pdf-word {

            position: absolute;

            margin: 0;
            padding: 0;

            white-space: pre;

            color: rgba(0,0,0,0.001);

            background: transparent;

            font-family: Arial, sans-serif;

            line-height: 1;

            user-select: text;

            -webkit-user-select: text;

            cursor: text;

            transform-origin: left top;
        }


        .pdf-word::selection {

            background: rgba(50, 120, 255, 0.35);

            color: transparent;
        }


        /* ==================================================
           SELECTED WORD HIGHLIGHT
        ================================================== */

        .pdf-word.tagged {

            background:
                rgba(255, 214, 0, 0.35);

            color:
                rgba(0,0,0,0.001);
        }


        /* ==================================================
           RIGHT
        ================================================== */

        .right-panel {

            background: white;

            border-left: 1px solid #c9ced6;

            display: flex;

            flex-direction: column;

            min-width: 0;

            overflow: hidden;
        }


        .right-header {

            padding: 14px 16px;

            border-bottom: 1px solid #ddd;

            font-weight: 700;
        }


        .right-content {

            flex: 1;

            overflow-y: auto;

            padding: 14px;
        }


        /* ==================================================
           UPLOAD
        ================================================== */

        .upload-box {

            border: 1px solid #d5dae0;

            border-radius: 8px;

            padding: 12px;

            margin-bottom: 15px;

            background: #fafafa;
        }

        .upload-box-title {

            font-weight: 700;

            margin-bottom: 8px;
        }


        /* ==================================================
           TAG GROUPS
        ================================================== */

        .tag-group {

            margin-bottom: 18px;
        }

        .tag-group-title {

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;

            color: #374151;
        }


        .tag-grid {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 6px;
        }


        .tag-button {

            border: 1px solid #cfd5dd;

            background: white;

            border-radius: 5px;

            padding: 8px 6px;

            font-size: 12px;

            cursor: pointer;

            text-align: center;
        }


        .tag-button:hover {

            background: #eef2f7;

            border-color: #9ca7b5;
        }


        /* ==================================================
           SELECTED TEXT
        ================================================== */

        .selected-box {

            border: 1px solid #d5dae0;

            border-radius: 7px;

            padding: 10px;

            margin-top: 10px;

            background: #fafafa;
        }

        .selected-title {

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 6px;
        }

        #selectedText {

            min-height: 55px;

            font-size: 12px;

            line-height: 1.4;

            color: #444;

            white-space: pre-wrap;

            word-break: break-word;
        }


        /* ==================================================
           TAGGED ITEMS
        ================================================== */

        .tagged-item {

            border: 1px solid #d9dee5;

            border-radius: 6px;

            padding: 8px;

            margin-bottom: 6px;

            background: white;

            font-size: 12px;
        }

        .tagged-item-name {

            font-weight: 700;

            color: #1f2937;

            margin-bottom: 4px;
        }

        .tagged-item-text {

            color: #555;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .remove-tag {

            margin-top: 5px;

            border: 0;

            background: #fee2e2;

            color: #991b1b;

            border-radius: 4px;

            padding: 4px 7px;

            cursor: pointer;

            font-size: 11px;
        }


        /* ==================================================
           XML
        ================================================== */

        .xml-box {

            margin-top: 15px;
        }

        .xml-box-title {

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;
        }

        #xmlPreview {

            width: 100%;

            min-height: 220px;

            resize: vertical;

            border: 1px solid #ccd2da;

            border-radius: 6px;

            padding: 9px;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 11px;

            line-height: 1.4;
        }


        /* ==================================================
           ACTIONS
        ================================================== */

        .actions {

            display: grid;

            grid-template-columns:
                repeat(2, minmax(0, 1fr));

            gap: 7px;

            margin-top: 8px;
        }

        .action-button {

            border: 1px solid #cbd2da;

            background: white;

            border-radius: 5px;

            padding: 8px;

            cursor: pointer;

            font-size: 12px;
        }

        .action-button:hover {

            background: #f1f4f7;
        }


        /* ==================================================
           PAGE COUNTER
        ================================================== */

        .page-counter {

            margin-left: auto;

            font-size: 12px;

            color: #666;
        }


        /* ==================================================
           RESPONSIVE
        ================================================== */

        @media (max-width: 900px) {

            .app {

                grid-template-columns:
                    1fr;
            }

            .right-panel {

                height: 45vh;

                border-left: 0;

                border-top: 1px solid #c9ced6;
            }

            .left-panel {

                height: 55vh;
            }
        }

    </style>

</head>


<body>


<!-- ======================================================
     TOPBAR
====================================================== -->

<div class="topbar">

    <div class="topbar-title">
        XML Tagger
    </div>

    <div class="topbar-subtitle">
        PDF + selecție precisă pentru tag-uri XML
    </div>

</div>


<!-- ======================================================
     APPLICATION
====================================================== -->

<div class="app">


    <!-- ==================================================
         LEFT
    ================================================== -->

    <section class="left-panel">


        <div class="document-toolbar">

            <label
                class="upload-label"
                for="pdfFile"
            >
                📄 Încarcă PDF
            </label>

            <input
                type="file"
                id="pdfFile"
                accept=".pdf,application/pdf"
            >

            <div
                class="file-name"
                id="fileName"
            >
                Niciun document încărcat
            </div>

            <div
                class="page-counter"
                id="pageCounter"
            >
            </div>

        </div>


        <div
            class="pdf-viewer"
            id="pdfViewer"
        >

            <div class="pdf-empty">

                Încarcă un PDF pentru a începe.

            </div>

        </div>


    </section>


    <!-- ==================================================
         RIGHT
    ================================================== -->

    <aside class="right-panel">


        <div class="right-header">

            Tag-uri XML

        </div>


        <div class="right-content">


            <!-- ==========================================
                 TAGURI
            =========================================== -->

            <div class="tag-group">

                <div class="tag-group-title">
                    Date articol
                </div>

                <div class="tag-grid">

                    <button
                        class="tag-button"
                        onclick="addTag('TITLU')"
                    >
                        TITLU
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('English_Title')"
                    >
                        English_Title
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Autor')"
                    >
                        Autor
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Functii')"
                    >
                        Functii
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Corespondent')"
                    >
                        Corespondent
                    </button>

                </div>

            </div>


            <div class="tag-group">

                <div class="tag-group-title">
                    Rezumate și cuvinte-cheie
                </div>

                <div class="tag-grid">

                    <button
                        class="tag-button"
                        onclick="addTag('Abstract')"
                    >
                        Abstract
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Keywords_ENG')"
                    >
                        Keywords_ENG
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Rezumat')"
                    >
                        Rezumat
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Keywords_ROM')"
                    >
                        Keywords_ROM
                    </button>

                </div>

            </div>


            <div class="tag-group">

                <div class="tag-group-title">
                    Conținut articol
                </div>

                <div class="tag-grid">

                    <button
                        class="tag-button"
                        onclick="addTag('Intertitlu')"
                    >
                        Intertitlu
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Sub_Intertitlu')"
                    >
                        Sub_Intertitlu
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('TEXT_indent')"
                    >
                        TEXT_indent
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('L')"
                    >
                        L
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('LI')"
                    >
                        LI
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('LBody')"
                    >
                        LBody
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('P')"
                    >
                        P
                    </button>

                </div>

            </div>


            <div class="tag-group">

                <div class="tag-group-title">
                    Structură XML
                </div>

                <div class="tag-grid">

                    <button
                        class="tag-button"
                        onclick="addTag('Lbl')"
                    >
                        Lbl
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('NormalParagraphStyle')"
                    >
                        NormalParagraphStyle
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('_No_paragraph_style_')"
                    >
                        _No_paragraph_style_
                    </button>

                    <button
                        class="tag-button"
                        onclick="addTag('Bibliografie')"
                    >
                        Bibliografie
                    </button>

                </div>

            </div>


            <!-- ==========================================
                 SELECTED
            =========================================== -->

            <div class="selected-box">

                <div class="selected-title">
                    Text selectat
                </div>

                <div id="selectedText">
                    Selectează textul din document.
                </div>

            </div>


            <!-- ==========================================
                 TAGGED
            =========================================== -->

            <div class="selected-box">

                <div class="selected-title">
                    Elemente etichetate
                </div>

                <div id="taggedItems">

                    Nu există încă elemente.

                </div>

            </div>


            <!-- ==========================================
                 XML
            =========================================== -->

            <div class="xml-box">

                <div class="xml-box-title">
                    XML rezultat
                </div>

                <textarea
                    id="xmlPreview"
                    spellcheck="false"
                    readonly
                ></textarea>


                <div class="actions">

                    <button
                        class="action-button"
                        onclick="generateXML()"
                    >
                        Generează XML
                    </button>

                    <button
                        class="action-button"
                        onclick="copyXML()"
                    >
                        Copiază XML
                    </button>

                    <button
                        class="action-button"
                        onclick="downloadXML()"
                    >
                        Descarcă XML
                    </button>

                    <button
                        class="action-button"
                        onclick="clearAll()"
                    >
                        Șterge
                    </button>

                </div>

            </div>


        </div>

    </aside>


</div>


<script>


// ==========================================================
// DATE GLOBALE
// ==========================================================

let pdfData = null;

let selectedRangeData = null;

let taggedItems = [];


// ==========================================================
// ELEMENTE
// ==========================================================

const pdfFile =
    document.getElementById("pdfFile");

const pdfViewer =
    document.getElementById("pdfViewer");

const fileName =
    document.getElementById("fileName");

const pageCounter =
    document.getElementById("pageCounter");

const selectedText =
    document.getElementById("selectedText");

const taggedItemsContainer =
    document.getElementById("taggedItems");

const xmlPreview =
    document.getElementById("xmlPreview");


// ==========================================================
// UPLOAD
// ==========================================================

pdfFile.addEventListener(
    "change",
    uploadPDF
);


async function uploadPDF() {

    const file =
        pdfFile.files[0];

    if (!file) {
        return;
    }


    if (
        !file.name
            .toLowerCase()
            .endsWith(".pdf")
    ) {

        alert(
            "Selectează un fișier PDF."
        );

        return;
    }


    fileName.textContent =
        file.name;

    pageCounter.textContent =
        "Se procesează...";


    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );


    try {

        const response =
            await fetch(
                "/upload-pdf",
                {
                    method: "POST",
                    body: formData
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            data.status !== "success"
        ) {

            throw new Error(
                data.message ||
                "Eroare la încărcarea PDF-ului."
            );
        }


        pdfData = data;

        taggedItems = [];

        selectedRangeData = null;


        renderPDF();


        renderTaggedItems();

        generateXML();


    } catch (error) {

        console.error(error);

        alert(
            error.message
        );

        pageCounter.textContent =
            "";

    }

}


// ==========================================================
// RANDARE PDF
// ==========================================================

function renderPDF() {

    pdfViewer.innerHTML = "";


    if (
        !pdfData ||
        !pdfData.pages ||
        !pdfData.pages.length
    ) {

        pdfViewer.innerHTML = `
            <div class="pdf-empty">
                PDF-ul nu conține pagini.
            </div>
        `;

        return;
    }


    pageCounter.textContent =
        `${pdfData.page_count} pagini`;


    pdfData.pages.forEach(
        renderPage
    );

}


// ==========================================================
// RANDARE PAGINA
// ==========================================================

function renderPage(pageData) {

    const page =
        document.createElement("div");

    page.className =
        "pdf-page";


    /*
     * Folosim dimensiunile reale ale
     * imaginii generate din PDF.
     */

    page.style.width =
        `${pageData.width}px`;

    page.style.height =
        `${pageData.height}px`;


    // ------------------------------------------------------
    // IMAGINE
    // ------------------------------------------------------

    const image =
        document.createElement("img");

    image.className =
        "pdf-page-image";

    image.src =
        pageData.image;

    image.width =
        pageData.width;

    image.height =
        pageData.height;

    image.draggable =
        false;


    page.appendChild(
        image
    );


    // ------------------------------------------------------
    // TEXT LAYER
    // ------------------------------------------------------

    const textLayer =
        document.createElement("div");

    textLayer.className =
        "pdf-text-layer";


    const scaleX =
        pageData.width /
        pageData.pdf_width;

    const scaleY =
        pageData.height /
        pageData.pdf_height;


    pageData.words.forEach(
        word => {

            const span =
                document.createElement("span");

            span.className =
                "pdf-word";


            span.dataset.page =
                pageData.page;

            span.dataset.wordId =
                word.id;

            span.dataset.text =
                word.text;


            /*
             * Coordonatele PDF sunt în puncte.
             * Le transformăm în coordonatele
             * imaginii randate.
             */

            const left =
                word.x0 * scaleX;

            const top =
                word.y0 * scaleY;

            const width =
                Math.max(
                    1,
                    (word.x1 - word.x0) * scaleX
                );

            const height =
                Math.max(
                    1,
                    (word.y1 - word.y0) * scaleY
                );


            span.style.left =
                `${left}px`;

            span.style.top =
                `${top}px`;

            span.style.width =
                `${width}px`;

            span.style.height =
                `${height}px`;


            /*
             * Fontul este foarte mic și aproape
             * invizibil. Imaginea PDF rămâne
             * elementul vizual principal.
             */

            span.style.fontSize =
                `${Math.max(4, height * 0.8)}px`;


            span.textContent =
                word.text;


            textLayer.appendChild(
                span
            );

        }
    );


    page.appendChild(
        textLayer
    );


    pdfViewer.appendChild(
        page
    );


    /*
     * Detectăm selecția după ce layer-ul
     * a fost construit.
     */

    textLayer.addEventListener(
        "mouseup",
        handleTextSelection
    );

}


// ==========================================================
// SELECȚIE TEXT
// ==========================================================

function handleTextSelection() {

    const selection =
        window.getSelection();


    if (
        !selection ||
        selection.isCollapsed
    ) {
        return;
    }


    const text =
        selection
            .toString()
            .trim();


    if (!text) {
        return;
    }


    const range =
        selection.getRangeAt(0);


    const words =
        collectSelectedWords(
            range
        );


    if (!words.length) {
        return;
    }


    const pageNumbers =
        [
            ...new Set(
                words.map(
                    w => w.page
                )
            )
        ];


    selectedRangeData = {

        text: text,

        words: words,

        pages: pageNumbers,

        startPage:
            Math.min(
                ...pageNumbers
            ),

        endPage:
            Math.max(
                ...pageNumbers
            )

    };


    selectedText.textContent =
        text;


    /*
     * Marcăm vizual cuvintele selectate.
     */

    document
        .querySelectorAll(
            ".pdf-word.selected"
        )
        .forEach(
            element => {
                element.classList.remove(
                    "selected"
                );
            }
        );


    words.forEach(
        item => {

            item.element.classList.add(
                "selected"
            );

        }
    );

}


// ==========================================================
// COLECTARE CUVINTE SELECTATE
// ==========================================================

function collectSelectedWords(range) {

    const allWords =
        Array.from(
            document.querySelectorAll(
                ".pdf-word"
            )
        );


    const selected = [];


    allWords.forEach(
        element => {

            try {

                if (
                    range.intersectsNode(
                        element
                    )
                ) {

                    selected.push({

                        element: element,

                        text:
                            element.dataset.text,

                        page:
                            Number(
                                element.dataset.page
                            ),

                        wordId:
                            Number(
                                element.dataset.wordId
                            )

                    });

                }

            } catch (error) {

                // Ignoram elementele invalide.

            }

        }
    );


    return selected;

}


// ==========================================================
// ADAUGARE TAG
// ==========================================================

function addTag(tagName) {

    if (
        !selectedRangeData ||
        !selectedRangeData.text
    ) {

        alert(
            "Selectează mai întâi textul din document."
        );

        return;
    }


    const item = {

        id:
            Date.now() +
            Math.random(),

        tag:
            tagName,

        text:
            selectedRangeData.text,

        pages:
            [...selectedRangeData.pages],

        startPage:
            selectedRangeData.startPage,

        endPage:
            selectedRangeData.endPage

    };


    taggedItems.push(
        item
    );


    /*
     * Marcăm elementele ca fiind taguite.
     */

    selectedRangeData.words.forEach(
        word => {

            word.element.classList.add(
                "tagged"
            );

        }
    );


    renderTaggedItems();

    generateXML();


    /*
     * După taguire, deselectăm textul.
     */

    window.getSelection().removeAllRanges();


    selectedRangeData = null;


    selectedText.textContent =
        "Selectează textul din document.";

}


// ==========================================================
// LISTĂ TAGURI
// ==========================================================

function renderTaggedItems() {

    if (!taggedItems.length) {

        taggedItemsContainer.innerHTML =
            "Nu există încă elemente.";

        return;
    }


    taggedItemsContainer.innerHTML =
        "";


    taggedItems.forEach(
        (item, index) => {

            const wrapper =
                document.createElement("div");

            wrapper.className =
                "tagged-item";


            const title =
                document.createElement("div");

            title.className =
                "tagged-item-name";

            title.textContent =
                `${index + 1}. <${item.tag}>`;


            const text =
                document.createElement("div");

            text.className =
                "tagged-item-text";

            text.textContent =
                item.text;


            const remove =
                document.createElement("button");

            remove.className =
                "remove-tag";

            remove.textContent =
                "Șterge";


            remove.onclick =
                function() {

                    taggedItems =
                        taggedItems.filter(
                            x =>
                                x.id !==
                                item.id
                        );

                    renderTaggedItems();

                    generateXML();

                };


            wrapper.appendChild(
                title
            );

            wrapper.appendChild(
                text
            );

            wrapper.appendChild(
                remove
            );


            taggedItemsContainer.appendChild(
                wrapper
            );

        }
    );

}


// ==========================================================
// ESCAPARE XML
// ==========================================================

function escapeXML(text) {

    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&apos;"
        );

}


// ==========================================================
// GENERARE XML
// ==========================================================

function generateXML() {

    if (!taggedItems.length) {

        xmlPreview.value =
            "";

        return;
    }


    /*
     * Sortare după pagina și poziția
     * în care au fost taguite.
     */

    const items =
        [...taggedItems].sort(
            (a, b) => {

                if (
                    a.startPage !==
                    b.startPage
                ) {

                    return (
                        a.startPage -
                        b.startPage
                    );

                }

                return 0;

            }
        );


    let xml =
        '<?xml version="1.0" encoding="UTF-8"?>\n';

    xml +=
        "<Document>\n";


    items.forEach(
        item => {

            const text =
                escapeXML(
                    item.text
                );


            /*
             * Bibliografie
             * ------------------------------------------------
             *
             * Păstrăm comportamentul special pentru
             * parserul științific existent.
             */

            if (
                item.tag ===
                "Bibliografie"
            ) {

                xml +=
                    "  <Story>\n";

                xml +=
                    "    <_No_paragraph_style_>\n";

                xml +=
                    "      Bibliografie\n";

                xml +=
                    "    </_No_paragraph_style_>\n";

                xml +=
                    "  </Story>\n";

                return;
            }


            xml +=
                "  <Story>\n";

            xml +=
                `    <${item.tag}>`;

            xml +=
                text;

            xml +=
                `</${item.tag}>\n`;

            xml +=
                "  </Story>\n";

        }
    );


    xml +=
        "</Document>";


    xmlPreview.value =
        xml;

}


// ==========================================================
// COPY XML
// ==========================================================

async function copyXML() {

    if (!xmlPreview.value) {

        generateXML();

    }


    if (!xmlPreview.value) {

        alert(
            "Nu există XML de copiat."
        );

        return;
    }


    try {

        await navigator.clipboard.writeText(
            xmlPreview.value
        );

        alert(
            "XML copiat."
        );

    } catch (error) {

        xmlPreview.select();

        document.execCommand(
            "copy"
        );

        alert(
            "XML copiat."
        );

    }

}


// ==========================================================
// DOWNLOAD XML
// ==========================================================

function downloadXML() {

    if (!xmlPreview.value) {

        generateXML();

    }


    if (!xmlPreview.value) {

        alert(
            "Nu există XML."
        );

        return;
    }


    const blob =
        new Blob(
            [
                xmlPreview.value
            ],
            {
                type:
                    "application/xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;

    link.download =
        "articol.xml";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


// ==========================================================
// CLEAR
// ==========================================================

function clearAll() {

    taggedItems = [];

    selectedRangeData = null;

    selectedText.textContent =
        "Selectează textul din document.";

    renderTaggedItems();

    generateXML();


    document
        .querySelectorAll(
            ".pdf-word.tagged"
        )
        .forEach(
            element => {

                element.classList.remove(
                    "tagged"
                );

            }
        );

}
