<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XML Tagger - PPTX</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #f1f3f5;
        }

        /* =====================================================
           TOPBAR
        ===================================================== */

        .topbar {
            height: 58px;
            background: #1f2937;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 18px;

            gap: 20px;
        }

        .topbar-title {
            font-size: 19px;
            font-weight: 700;
            white-space: nowrap;
        }

        .upload-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #pptFile {
            color: white;
        }

        .upload-button {
            border: 0;
            background: #2563eb;
            color: white;

            padding: 9px 16px;

            border-radius: 6px;

            cursor: pointer;

            font-weight: 600;
        }

        .upload-button:hover {
            background: #1d4ed8;
        }

        .status {
            font-size: 13px;
            opacity: 0.9;
        }

        /* =====================================================
           MAIN
        ===================================================== */

        .main {
            height: calc(100vh - 58px);

            display: grid;

            grid-template-columns:
                minmax(500px, 1fr)
                420px;

            overflow: hidden;
        }

        /* =====================================================
           LEFT
        ===================================================== */

        .viewer {
            overflow: auto;

            background: #d7dbe0;

            padding: 30px;
        }

        .slides-container {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 35px;
        }

        .empty-viewer {
            margin-top: 100px;

            color: #6b7280;

            text-align: center;

            font-size: 17px;
        }

        /* =====================================================
           SLIDE
        ===================================================== */

        .slide-wrapper {
            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 8px;
        }

        .slide-label {
            color: #374151;

            font-size: 13px;

            font-weight: 600;
        }

        .slide {
            position: relative;

            background: white;

            box-shadow:
                0 5px 18px
                rgba(0,0,0,0.20);

            overflow: hidden;

            flex-shrink: 0;
        }

        /* =====================================================
           SLIDE SHAPES
        ===================================================== */

        .ppt-shape {
            position: absolute;

            overflow: visible;
        }

        .ppt-image {
            position: absolute;

            object-fit: contain;

            user-select: none;

            -webkit-user-select: none;

            pointer-events: none;
        }

        /* =====================================================
           TEXT BOX
        ===================================================== */

        .ppt-textbox {

            position: absolute;

            overflow: visible;

            white-space: normal;

            cursor: text;

            user-select: text;
            -webkit-user-select: text;

            color: #000;

        }

        .ppt-paragraph {

            margin: 0;

            padding: 0;

            white-space: pre-wrap;

            user-select: text;
            -webkit-user-select: text;

        }

        .ppt-run {

            user-select: text;
            -webkit-user-select: text;

        }

        /* =====================================================
           RIGHT PANEL
        ===================================================== */

        .panel {

            background: white;

            border-left: 1px solid #d1d5db;

            display: flex;

            flex-direction: column;

            min-width: 0;

            overflow: hidden;
        }

        .panel-header {

            padding: 15px;

            border-bottom:
                1px solid #e5e7eb;

            font-size: 16px;

            font-weight: 700;

        }

        /* =====================================================
           TAGS
        ===================================================== */

        .tags {

            padding: 12px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 7px;

            border-bottom:
                1px solid #e5e7eb;

            max-height: 260px;

            overflow-y: auto;

        }

        .tag-button {

            border: 1px solid #cbd5e1;

            background: #f8fafc;

            padding: 7px 8px;

            border-radius: 5px;

            cursor: pointer;

            font-size: 12px;

            text-align: left;

            font-weight: 600;

        }

        .tag-button:hover {

            background: #e5e7eb;

        }

        .tag-button.active {

            background: #2563eb;

            color: white;

            border-color: #2563eb;

        }

        /* =====================================================
           SELECTION
        ===================================================== */

        .selection-box {

            padding: 12px;

            border-bottom:
                1px solid #e5e7eb;

        }

        .selection-title {

            font-size: 12px;

            font-weight: 700;

            margin-bottom: 7px;

            color: #374151;

        }

        #selectedText {

            width: 100%;

            min-height: 90px;

            resize: vertical;

            border: 1px solid #cbd5e1;

            border-radius: 5px;

            padding: 8px;

            font-family: Arial, sans-serif;

            font-size: 13px;

        }

        /* =====================================================
           TAGGED ITEMS
        ===================================================== */

        .items-title {

            padding: 12px;

            padding-bottom: 6px;

            font-size: 13px;

            font-weight: 700;

        }

        .tagged-items {

            flex: 1;

            overflow-y: auto;

            padding: 0 12px 12px 12px;

        }

        .tagged-item {

            border: 1px solid #d1d5db;

            border-radius: 5px;

            padding: 8px;

            margin-bottom: 8px;

            background: #f9fafb;

        }

        .tagged-item-tag {

            font-size: 11px;

            font-weight: 700;

            color: #2563eb;

            margin-bottom: 4px;

        }

        .tagged-item-text {

            font-size: 12px;

            white-space: pre-wrap;

            word-break: break-word;

        }

        .delete-item {

            margin-top: 6px;

            border: 0;

            background: #dc2626;

            color: white;

            padding: 4px 7px;

            border-radius: 4px;

            cursor: pointer;

            font-size: 11px;

        }

        /* =====================================================
           XML
        ===================================================== */

        .xml-section {

            border-top:
                1px solid #d1d5db;

            padding: 12px;

        }

        .xml-title {

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 7px;

        }

        #xmlPreview {

            width: 100%;

            height: 160px;

            resize: vertical;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 11px;

            padding: 8px;

            border: 1px solid #cbd5e1;

            border-radius: 5px;

            background: #f8fafc;

        }

        /* =====================================================
           ACTIONS
        ===================================================== */

        .actions {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 7px;

            padding-top: 8px;

        }

        .action-button {

            border: 0;

            border-radius: 5px;

            padding: 8px;

            cursor: pointer;

            font-weight: 600;

            font-size: 12px;

            background: #2563eb;

            color: white;

        }

        .action-button.secondary {

            background: #4b5563;

        }

        .action-button.danger {

            background: #dc2626;

        }

        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (
            max-width: 1000px
        ) {

            .main {

                grid-template-columns:
                    1fr;

            }

            .panel {

                height: 50vh;

            }

            .viewer {

                height: 50vh;

            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     TOPBAR
========================================================= -->

<div class="topbar">

    <div class="topbar-title">
        XML Tagger
    </div>

    <div class="upload-area">

        <input
            type="file"
            id="pptFile"
            accept=".pptx,.ppt"
        >

        <button
            class="upload-button"
            onclick="uploadPPT()"
        >
            Încarcă PPT
        </button>

    </div>

    <div
        id="status"
        class="status"
    >
        Așteaptă fișierul...
    </div>

</div>


<!-- =========================================================
     MAIN
========================================================= -->

<div class="main">


    <!-- =====================================================
         VIEWER
    ====================================================== -->

    <div
        class="viewer"
        id="viewer"
    >

        <div
            class="empty-viewer"
            id="emptyViewer"
        >
            Încarcă un fișier PPTX pentru a începe.
        </div>

        <div
            class="slides-container"
            id="slidesContainer"
        ></div>

    </div>


    <!-- =====================================================
         PANEL
    ====================================================== -->

    <div class="panel">


        <div class="panel-header">
            Selectare XML
        </div>


        <!-- TAGS -->

        <div class="tags">

            <button
                class="tag-button"
                onclick="selectTag('TITLU')"
            >
                TITLU
            </button>

            <button
                class="tag-button"
                onclick="selectTag('English_Title')"
            >
                English_Title
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Autor')"
            >
                Autor
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Functii')"
            >
                Functii
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Corespondent')"
            >
                Corespondent
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Abstract')"
            >
                Abstract
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Keywords_ENG')"
            >
                Keywords_ENG
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Rezumat')"
            >
                Rezumat
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Keywords_ROM')"
            >
                Keywords_ROM
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Intertitlu')"
            >
                Intertitlu
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Sub_Intertitlu')"
            >
                Sub_Intertitlu
            </button>

            <button
                class="tag-button"
                onclick="selectTag('TEXT_indent')"
            >
                TEXT_indent
            </button>

            <button
                class="tag-button"
                onclick="selectTag('L')"
            >
                L
            </button>

            <button
                class="tag-button"
                onclick="selectTag('LI')"
            >
                LI
            </button>

            <button
                class="tag-button"
                onclick="selectTag('LBody')"
            >
                LBody
            </button>

            <button
                class="tag-button"
                onclick="selectTag('P')"
            >
                P
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Lbl')"
            >
                Lbl
            </button>

            <button
                class="tag-button"
                onclick="selectTag('NormalParagraphStyle')"
            >
                NormalParagraphStyle
            </button>

            <button
                class="tag-button"
                onclick="selectTag('_No_paragraph_style_')"
            >
                _No_paragraph_style_
            </button>

            <button
                class="tag-button"
                onclick="selectTag('Bibliografie')"
            >
                Bibliografie
            </button>

        </div>


        <!-- SELECTION -->

        <div class="selection-box">

            <div class="selection-title">
                Text selectat
            </div>

            <textarea
                id="selectedText"
                placeholder="Selectează text direct din slide..."
                readonly
            ></textarea>

        </div>


        <!-- ITEMS -->

        <div class="items-title">
            Elemente XML
        </div>

        <div
            class="tagged-items"
            id="taggedItems"
        ></div>


        <!-- XML -->

        <div class="xml-section">

            <div class="xml-title">
                XML rezultat
            </div>

            <textarea
                id="xmlPreview"
                readonly
            ></textarea>

            <div class="actions">

                <button
                    class="action-button"
                    onclick="generateXML()"
                >
                    Generează XML
                </button>

                <button
                    class="action-button secondary"
                    onclick="copyXML()"
                >
                    Copiază XML
                </button>

                <button
                    class="action-button secondary"
                    onclick="downloadXML()"
                >
                    Descarcă XML
                </button>

                <button
                    class="action-button danger"
                    onclick="clearAll()"
                >
                    Șterge tot
                </button>

            </div>

        </div>


    </div>

</div>


<script>


// ============================================================
// GLOBAL
// ============================================================

let presentationData = null;

let selectedTag = null;

let currentSelection = null;

let taggedItems = [];


// ============================================================
// TAG
// ============================================================

function selectTag(tag) {

    selectedTag = tag;

    document
        .querySelectorAll(".tag-button")
        .forEach(button => {

            button.classList.remove(
                "active"
            );

        });

    document
        .querySelectorAll(".tag-button")
        .forEach(button => {

            if (
                button.textContent.trim()
                === tag
            ) {

                button.classList.add(
                    "active"
                );

            }

        });

    processCurrentSelection();

}


// ============================================================
// UPLOAD
// ============================================================

async function uploadPPT() {

    const input =
        document.getElementById(
            "pptFile"
        );

    const file =
        input.files[0];

    if (!file) {

        alert(
            "Selectează un fișier PPTX."
        );

        return;
    }

    const status =
        document.getElementById(
            "status"
        );

    status.textContent =
        "Se procesează PPTX...";

    const formData =
        new FormData();

    formData.append(
        "file",
        file
    );

    try {

        const response =
            await fetch(
                "/upload-ppt/",
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        if (!response.ok) {

            throw new Error(
                data.message ||
                "Eroare la upload."
            );

        }

        presentationData =
            data.presentation;

        renderPresentation(
            presentationData
        );

        status.textContent =
            `Încărcat: ${data.filename} — ${data.slide_count} slide-uri`;

    }
    catch (error) {

        console.error(error);

        status.textContent =
            "Eroare.";

        alert(
            error.message
        );

    }

}


// ============================================================
// RENDER PRESENTATION
// ============================================================

function renderPresentation(
    presentation
) {

    const container =
        document.getElementById(
            "slidesContainer"
        );

    const empty =
        document.getElementById(
            "emptyViewer"
        );

    container.innerHTML = "";

    empty.style.display =
        "none";

    presentation.slides.forEach(
        slideData => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "slide-wrapper";


            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "slide-label";

            label.textContent =
                `Slide ${slideData.slide}`;


            const slide =
                document.createElement(
                    "div"
                );

            slide.className =
                "slide";

            slide.style.width =
                slideData.width + "px";

            slide.style.height =
                slideData.height + "px";


            slide.dataset.slide =
                slideData.slide;


            // ------------------------------------------------
            // SHAPES
            // ------------------------------------------------

            slideData.shapes.forEach(
                shape => {

                    renderShape(
                        slide,
                        shape,
                        slideData
                    );

                }
            );


            wrapper.appendChild(
                label
            );

            wrapper.appendChild(
                slide
            );

            container.appendChild(
                wrapper
            );

        }
    );

}


// ============================================================
// RENDER SHAPE
// ============================================================

function renderShape(
    slide,
    shape,
    slideData
) {

    if (
        shape.kind === "image"
    ) {

        const img =
            document.createElement(
                "img"
            );

        img.className =
            "ppt-image";

        img.src =
            shape.url;

        img.style.left =
            shape.left + "px";

        img.style.top =
            shape.top + "px";

        img.style.width =
            shape.width + "px";

        img.style.height =
            shape.height + "px";

        slide.appendChild(
            img
        );

        return;
    }


    if (
        shape.kind === "text"
    ) {

        const box =
            document.createElement(
                "div"
            );

        box.className =
            "ppt-textbox";

        box.style.left =
            shape.left + "px";

        box.style.top =
            shape.top + "px";

        box.style.width =
            shape.width + "px";

        box.style.height =
            shape.height + "px";


        // ----------------------------------------------------
        // PARAGRAPHS
        // ----------------------------------------------------

        shape.paragraphs.forEach(
            paragraph => {

                const p =
                    document.createElement(
                        "div"
                    );

                p.className =
                    "ppt-paragraph";


                // ------------------------------------------------
                // RUNS
                // ------------------------------------------------

                if (
                    paragraph.runs &&
                    paragraph.runs.length
                ) {

                    paragraph.runs.forEach(
                        run => {

                            const span =
                                document.createElement(
                                    "span"
                                );

                            span.className =
                                "ppt-run";

                            span.textContent =
                                run.text;


                            const style =
                                run.style || {};


                            if (
                                style.bold
                            ) {

                                span.style.fontWeight =
                                    "700";

                            }


                            if (
                                style.italic
                            ) {

                                span.style.fontStyle =
                                    "italic";

                            }


                            if (
                                style.underline
                            ) {

                                span.style.textDecoration =
                                    "underline";

                            }


                            if (
                                style.font_size
                            ) {

                                span.style.fontSize =
                                    style.font_size +
                                    "px";

                            }


                            if (
                                style.font_name
                            ) {

                                span.style.fontFamily =
                                    `"${style.font_name}", Arial, sans-serif`;

                            }


                            if (
                                style.color
                            ) {

                                span.style.color =
                                    style.color;

                            }


                            p.appendChild(
                                span
                            );

                        }
                    );

                }
                else {

                    p.textContent =
                        paragraph.text || "";

                }


                box.appendChild(
                    p
                );

            }
        );


        slide.appendChild(
            box
        );

    }

}


// ============================================================
// SELECTION
// ============================================================

document.addEventListener(
    "mouseup",
    function() {

        setTimeout(
            captureSelection,
            10
        );

    }
);


function captureSelection() {

    const selection =
        window.getSelection();

    if (
        !selection ||
        selection.rangeCount === 0
    ) {

        return;

    }

    const text =
        selection
            .toString()
            .trim();

    if (!text) {

        return;

    }


    const range =
        selection.getRangeAt(0);


    // --------------------------------------------------------
    // VERIFICĂM DACĂ SELECȚIA ESTE ÎN SLIDE
    // --------------------------------------------------------

    let node =
        range.commonAncestorContainer;

    if (
        node.nodeType === Node.TEXT_NODE
    ) {

        node = node.parentElement;

    }


    const slide =
        node.closest(
            ".slide"
        );

    if (!slide) {

        return;

    }


    currentSelection = {

        text: text,

        slide:
            slide.dataset.slide,

        range: range.cloneRange()

    };


    document
        .getElementById(
            "selectedText"
        )
        .value = text;


    processCurrentSelection();

}


// ============================================================
// PROCESS SELECTION
// ============================================================

function processCurrentSelection() {

    if (
        !selectedTag ||
        !currentSelection
    ) {

        return;

    }

    const text =
        currentSelection.text;

    if (!text) {

        return;

    }


    taggedItems.push({

        tag: selectedTag,

        text: text,

        slide: currentSelection.slide

    });


    renderTaggedItems();

    generateXML();


    // --------------------------------------------------------
    // RESET
    // --------------------------------------------------------

    currentSelection = null;

    window
        .getSelection()
        .removeAllRanges();

    document
        .getElementById(
            "selectedText"
        )
        .value = "";

}


// ============================================================
// RENDER TAGGED ITEMS
// ============================================================

function renderTaggedItems() {

    const container =
        document.getElementById(
            "taggedItems"
        );

    container.innerHTML = "";


    taggedItems.forEach(
        (item, index) => {

            const div =
                document.createElement(
                    "div"
                );

            div.className =
                "tagged-item";


            const tag =
                document.createElement(
                    "div"
                );

            tag.className =
                "tagged-item-tag";

            tag.textContent =
                `${item.tag} — Slide ${item.slide}`;


            const text =
                document.createElement(
                    "div"
                );

            text.className =
                "tagged-item-text";

            text.textContent =
                item.text;


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "delete-item";

            remove.textContent =
                "Șterge";


            remove.onclick =
                function() {

                    taggedItems.splice(
                        index,
                        1
                    );

                    renderTaggedItems();

                    generateXML();

                };


            div.appendChild(
                tag
            );

            div.appendChild(
                text
            );

            div.appendChild(
                remove
            );


            container.appendChild(
                div
            );

        }
    );

}


// ============================================================
// XML ESCAPE
// ============================================================

function escapeXML(text) {

    return text
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&apos;"
        );

}


// ============================================================
// XML
// ============================================================

function generateXML() {

    let xml =
`<?xml version="1.0" encoding="UTF-8"?>
<Document>`;


    taggedItems.forEach(
        item => {

            xml +=
`
  <Story>
    <${item.tag}>${escapeXML(item.text)}</${item.tag}>
  </Story>`;

        }
    );


    xml +=
`
</Document>`;


    document
        .getElementById(
            "xmlPreview"
        )
        .value = xml;

}


// ============================================================
// COPY XML
// ============================================================

async function copyXML() {

    const xml =
        document
            .getElementById(
                "xmlPreview"
            )
            .value;

    if (!xml) {

        return;

    }

    try {

        await navigator.clipboard.writeText(
            xml
        );

        alert(
            "XML copiat."
        );

    }
    catch (error) {

        alert(
            "Nu am putut copia XML-ul."
        );

    }

}


// ============================================================
// DOWNLOAD XML
// ============================================================

function downloadXML() {

    const xml =
        document
            .getElementById(
                "xmlPreview"
            )
            .value;

    if (!xml) {

        generateXML();

    }


    const finalXML =
        document
            .getElementById(
                "xmlPreview"
            )
            .value;


    const blob =
        new Blob(
            [finalXML],
            {
                type:
                    "application/xml;charset=utf-8"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );

    a.href = url;

    a.download =
        "articol_tagged.xml";

    document.body.appendChild(
        a
    );

    a.click();

    a.remove();

    URL.revokeObjectURL(
        url
    );

}


// ============================================================
// CLEAR
// ============================================================

function clearAll() {

    taggedItems = [];

    currentSelection = null;

    selectedTag = null;

    document
        .getElementById(
            "selectedText"
        )
        .value = "";

    document
        .getElementById(
            "xmlPreview"
        )
        .value = "";

    renderTaggedItems();


    document
        .querySelectorAll(
            ".tag-button"
        )
        .forEach(
            button => {

                button.classList.remove(
                    "active"
                );

            }
        );

}


</script>
