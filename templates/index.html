
<!DOCTYPE html>
<html lang="ro">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XML Tagger</title>


    <!-- =====================================================
         PDF.JS
         ===================================================== -->

    <script
        type="module"
        src="https://cdn.jsdelivr.net/npm/pdfjs-dist@latest/build/pdf.min.mjs">
    </script>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #f3f4f6;

            color: #222;
        }


        /* ==================================================
           HEADER
           ================================================== */

        header {

            background: #1f2937;

            color: white;

            padding: 15px 22px;

            display: flex;

            align-items: center;

            justify-content: space-between;
        }


        header h1 {

            margin: 0;

            font-size: 21px;
        }


        header span {

            font-size: 13px;

            opacity: 0.8;
        }


        /* ==================================================
           CONTAINER
           ================================================== */

        .container {

            max-width: 1800px;

            margin: auto;

            padding: 18px;
        }


        /* ==================================================
           UPLOAD
           ================================================== */

        .upload-box {

            background: white;

            padding: 14px;

            border-radius: 8px;

            margin-bottom: 16px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .upload-row {

            display: flex;

            gap: 10px;

            align-items: center;

            flex-wrap: wrap;
        }


        input[type="file"] {

            padding: 6px;
        }


        button {

            border: none;

            border-radius: 5px;

            padding: 8px 13px;

            cursor: pointer;

            font-size: 13px;

            background: #2563eb;

            color: white;
        }


        button:hover {

            opacity: 0.9;
        }


        button:disabled {

            opacity: 0.4;

            cursor: not-allowed;
        }


        button.secondary {

            background: #6b7280;
        }


        button.danger {

            background: #dc2626;
        }


        button.small {

            padding: 5px 8px;

            font-size: 12px;
        }


        #status {

            margin-top: 9px;

            font-size: 13px;
        }


        /* ==================================================
           WORKSPACE
           ================================================== */

        .workspace {

            display: grid;

            grid-template-columns:
                minmax(500px, 1fr)
                390px;

            gap: 16px;

            align-items: start;
        }


        /* ==================================================
           PDF PANEL
           ================================================== */

        .pdf-panel {

            background: #525659;

            border-radius: 8px;

            padding: 12px;

            min-height: 800px;

            overflow: auto;
        }


        /* ==================================================
           PDF TOOLBAR
           ================================================== */

        .pdf-toolbar {

            background: #1f2937;

            color: white;

            padding: 9px;

            border-radius: 6px;

            margin-bottom: 12px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }


        .pdf-toolbar button {

            background: #374151;

            min-width: 38px;
        }


        #pageInfo {

            min-width: 110px;

            text-align: center;

            font-size: 13px;
        }


        /* ==================================================
           PDF PAGE
           ================================================== */

        #pdfContainer {

            display: flex;

            justify-content: center;

            width: 100%;
        }


        .pdf-page {

            position: relative;

            background: white;

            box-shadow:
                0 2px 14px rgba(0,0,0,0.35);

            user-select: text;

            -webkit-user-select: text;
        }


        .pdf-page canvas {

            display: block;
        }


        /* ==================================================
           PDF.JS TEXT LAYER
           ================================================== */

        .textLayer {

            position: absolute;

            inset: 0;

            overflow: hidden;

            line-height: 1;

            text-size-adjust: none;

            forced-color-adjust: none;

            transform-origin: 0 0;

            z-index: 2;

            cursor: text;
        }


        .textLayer span,
        .textLayer br {

            color: transparent;

            position: absolute;

            white-space: pre;

            transform-origin: 0% 0%;
        }


        .textLayer span {

            cursor: text;
        }


        .textLayer ::selection {

            background:
                rgba(37, 99, 235, 0.35);
        }


        .textLayer span::selection {

            background:
                rgba(37, 99, 235, 0.35);
        }


        /* ==================================================
           RIGHT PANEL
           ================================================== */

        .right-panel {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .card {

            background: white;

            border-radius: 8px;

            padding: 14px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.08);
        }


        .card h2 {

            margin: 0 0 10px 0;

            font-size: 16px;
        }


        /* ==================================================
           SELECTION
           ================================================== */

        #selectedText {

            min-height: 70px;

            padding: 9px;

            border:
                1px solid #d1d5db;

            border-radius: 5px;

            background: #f9fafb;

            font-size: 13px;

            line-height: 1.45;

            white-space: pre-wrap;

            word-break: break-word;
        }


        .no-selection {

            color: #9ca3af;
        }


        /* ==================================================
           TAGURI
           ================================================== */

        .tag-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 6px;
        }


        .tag-button {

            background: #eef2ff;

            color: #1e3a8a;

            border:
                1px solid #c7d2fe;

            text-align: left;

            padding: 7px;

            font-size: 12px;
        }


        .tag-button:hover {

            background: #dbeafe;
        }


        /* ==================================================
           TAGGED ITEMS
           ================================================== */

        .tagged-list {

            display: flex;

            flex-direction: column;

            gap: 7px;
        }


        .tagged-item {

            border:
                1px solid #d1d5db;

            border-radius: 6px;

            padding: 8px;

            background: #fafafa;
        }


        .tagged-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 4px;
        }


        .tag-name {

            font-size: 12px;

            font-weight: bold;

            color: #1d4ed8;
        }


        .tag-number {

            font-size: 11px;

            color: #6b7280;
        }


        .tagged-text {

            font-size: 12px;

            line-height: 1.4;

            max-height: 70px;

            overflow: auto;

            word-break: break-word;
        }


        .item-actions {

            margin-top: 7px;

            display: flex;

            gap: 4px;
        }


        /* ==================================================
           XML
           ================================================== */

        .xml-panel {

            margin-top: 16px;

            background: #111827;

            color: white;

            border-radius: 8px;

            padding: 14px;
        }


        .xml-panel h2 {

            margin: 0 0 10px 0;

            font-size: 16px;
        }


        #xmlPreview {

            width: 100%;

            min-height: 280px;

            resize: vertical;

            padding: 10px;

            border:
                1px solid #374151;

            border-radius: 5px;

            background: #030712;

            color: #d1d5db;

            font-family:
                Consolas,
                Monaco,
                monospace;

            font-size: 12px;

            line-height: 1.5;
        }


        .xml-actions {

            margin-top: 9px;

            display: flex;

            gap: 7px;
        }


        .empty {

            color: #9ca3af;

            font-size: 13px;

            text-align: center;

            padding: 20px;
        }


        /* ==================================================
           RESPONSIVE
           ================================================== */

        @media (max-width: 1100px) {

            .workspace {

                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<header>

    <h1>🏷️ XML Tagger</h1>

    <span>
        PDF → selecție text → tag XML
    </span>

</header>


<div class="container">


    <!-- ==================================================
         UPLOAD
         ================================================== -->

    <div class="upload-box">

        <div class="upload-row">

            <input
                type="file"
                id="pdfFile"
                accept=".pdf,application/pdf"
            >

            <button

            </button>

        </div>


        <div id="status"></div>

    </div>


    <!-- ==================================================
         WORKSPACE
         ================================================== -->

    <div class="workspace">


        <!-- =================================================
             PDF
             ================================================= -->

        <div class="pdf-panel">


            <div class="pdf-toolbar">


                <button
                    id="prevPage"
                    disabled
                >
                    ◀
                </button>


                <span id="pageInfo">
                    Pagina 0 / 0
                </span>


                <button
                    id="nextPage"
                    disabled
                >
                    ▶
                </button>

                <div class="empty">

                </div>

             ================================================= -->

                 SELECTED TEXT
                 ============================================= -->

                    </button>

                    >
                        Intertitlu
                    </button>


                    <button
                        class="tag-button"
                        data-tag="Sub_Intertitlu"
                    >
                        Sub_Intertitlu
                    </button>


                    <button

                    </button>


                    <button

                    <button

         XML
         ================================================== -->

<!-- ======================================================
     JAVASCRIPT
     ====================================================== -->

<script type="module">


    // =====================================================
    // PDF.JS
    // =====================================================

    import * as pdfjsLib
        from "https://cdn.jsdelivr.net/npm/pdfjs-dist@latest/build/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdn.jsdelivr.net/npm/pdfjs-dist@latest/build/pdf.worker.min.mjs";


    // =====================================================
    // DOM
    // =====================================================

    const pdfFile =
        document.getElementById("pdfFile");


    const uploadButton =
        document.getElementById("uploadButton");


    const status =
        document.getElementById("status");


    const pdfContainer =
        document.getElementById("pdfContainer");


    const selectedTextBox =
        document.getElementById("selectedText");


    const clearSelectionButton =
        document.getElementById("clearSelection");


    const taggedList =
        document.getElementById("taggedList");


    const xmlPreview =
        document.getElementById("xmlPreview");


    const copyXmlButton =
        document.getElementById("copyXml");


    const downloadXmlButton =
        document.getElementById("downloadXml");


    const prevPageButton =
        document.getElementById("prevPage");


    const nextPageButton =
        document.getElementById("nextPage");


    const pageInfo =
        document.getElementById("pageInfo");


    // =====================================================
    // STATE
    // =====================================================

    let pdfDocument = null;

    let totalPages = 0;

    let currentPage = 1;

    let selectedText = "";

    let taggedItems = [];


    // =====================================================
    // UPLOAD
    // =====================================================

    uploadButton.addEventListener(
        "click",
        async () => {


            const file =
                pdfFile.files[0];


            if (!file) {

                status.textContent =
                    "Selectează mai întâi un PDF.";

                return;
            }


            if (
                file.type !== "application/pdf" &&
                !file.name
                    .toLowerCase()
                    .endsWith(".pdf")
            ) {

                status.textContent =
                    "Este permis doar formatul PDF.";

                return;
            }


            status.textContent =
                "Se încarcă PDF-ul...";


            const formData =
                new FormData();


            formData.append(
                "file",
                file
            );


            try {


                const response =
                    await fetch(
                        "/upload",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        result.detail ||
                        "Eroare la upload."
                    );
                }


                status.textContent =
                    "PDF încărcat: " +
                    result.filename;


                await loadPdf(
                    result.url
                );


            } catch (error) {


                console.error(error);


                status.textContent =
                    "Eroare: " +
                    error.message;

            }

        }
    );


    // =====================================================
    // LOAD PDF
    // =====================================================

    async function loadPdf(url) {


        pdfContainer.innerHTML = "";


        taggedItems = [];

        selectedText = "";


        updateSelectedText();

        updateTaggedList();

        updateXml();


        try {


            pdfDocument =
                await pdfjsLib.getDocument({

                    url: url,

                    enableXfa: false,

                    enableScripting: false

                }).promise;


            totalPages =
                pdfDocument.numPages;


            currentPage = 1;


            updatePageControls();


            await renderCurrentPage();


        } catch (error) {


            console.error(error);


            pdfContainer.innerHTML =
                `
                <div class="empty">
                    Nu am putut afișa PDF-ul.
                </div>
                `;


            status.textContent =
                "Eroare PDF.js: " +
                error.message;

        }

    }


    // =====================================================
    // RENDER CURRENT PAGE
    // =====================================================

    async function renderCurrentPage() {


        if (!pdfDocument) {

            return;
        }


        pdfContainer.innerHTML = "";


        const page =
            await pdfDocument.getPage(
                currentPage
            );


        /*
         * Scala poate fi modificată ulterior
         * pentru zoom.
         */

        const scale = 1.35;


        const viewport =
            page.getViewport({
                scale: scale
            });


        // ================================================
        // PAGE CONTAINER
        // ================================================

        const pageContainer =
            document.createElement("div");


        pageContainer.className =
            "pdf-page";


        pageContainer.style.width =
            `${viewport.width}px`;


        pageContainer.style.height =
            `${viewport.height}px`;


        // ================================================
        // CANVAS
        // ================================================

        const canvas =
            document.createElement("canvas");


        canvas.width =
            Math.ceil(viewport.width);


        canvas.height =
            Math.ceil(viewport.height);


        canvas.style.width =
            `${viewport.width}px`;


        canvas.style.height =
            `${viewport.height}px`;


        const context =
            canvas.getContext("2d");


        pageContainer.appendChild(
            canvas
        );


        // ================================================
        // TEXT LAYER
        // ================================================

        const textLayer =
            document.createElement("div");


        textLayer.className =
            "textLayer";


        textLayer.style.width =
            `${viewport.width}px`;


        textLayer.style.height =
            `${viewport.height}px`;


        pageContainer.appendChild(
            textLayer
        );


        pdfContainer.appendChild(
            pageContainer
        );


        // ================================================
        // RENDER CANVAS
        // ================================================

        await page.render({

            canvasContext:
                context,

            viewport:
                viewport

        }).promise;


        // ================================================
        // TEXT CONTENT
        // ================================================

        const textContent =
            await page.getTextContent({

                includeMarkedContent:
                    false,

                disableNormalization:
                    false

            });


        /*
         * Construim text layer-ul folosind
         * datele reale furnizate de PDF.js.
         *
         * Important:
         * nu mai facem manual presupuneri
         * despre poziția cuvintelor.
         */

        await renderTextLayer(

            textContent,

            viewport,

            textLayer

        );


        updatePageControls();

    }


    // =====================================================
    // PDF.JS TEXT LAYER
    // =====================================================

    async function renderTextLayer(
        textContent,
        viewport,
        container
    ) {


        /*
         * Folosim TextLayer-ul PDF.js.
         *
         * Dacă versiunea CDN disponibilă expune
         * TextLayer, acesta este mecanismul oficial
         * pentru poziționarea textului.
         */

        if (
            typeof pdfjsLib.TextLayer ===
            "function"
        ) {


            const textLayer =
                new pdfjsLib.TextLayer({

                    textContentSource:
                        textContent,

                    container:
                        container,

                    viewport:
                        viewport

                });


            await textLayer.render();


            return;
        }


        /*
         * Fallback pentru versiuni PDF.js
         * care nu expun TextLayer în build.
         */

        await renderTextLayerFallback(
            textContent,
            viewport,
            container
        );

    }


    // =====================================================
    // FALLBACK TEXT LAYER
    // =====================================================

    async function renderTextLayerFallback(
        textContent,
        viewport,
        container
    ) {


        const items =
            textContent.items;


        for (
            const item
            of items
        ) {


            if (
                !item.str
            ) {

                continue;
            }


            const span =
                document.createElement("span");


            span.textContent =
                item.str;


            /*
             * Transformarea PDF.js.
             */

            const tx =
                pdfjsLib.Util.transform(

                    viewport.transform,

                    item.transform

                );


            const x =
                tx[4];


            const y =
                tx[5];


            const fontHeight =
                Math.sqrt(

                    tx[2] * tx[2] +
                    tx[3] * tx[3]

                );


            span.style.left =
                `${x}px`;


            span.style.top =
                `${y - fontHeight}px`;


            span.style.fontSize =
                `${fontHeight}px`;


            span.style.fontFamily =
                "sans-serif";


            /*
             * Folosim lățimea reală furnizată
             * de PDF.js.
             */

            if (
                item.width
            ) {

                const scaleX =
                    (
                        item.width *
                        viewport.scale
                    ) /
                    Math.max(
                        1,
                        span
                            .getBoundingClientRect()
                            .width
                    );


                if (
                    Number.isFinite(scaleX) &&
                    scaleX > 0
                ) {

                    span.style.transform =
                        `scaleX(${scaleX})`;

                }

            }


            container.appendChild(
                span
            );

        }

    }


    // =====================================================
    // NEXT PAGE
    // =====================================================

    nextPageButton.addEventListener(
        "click",
        async () => {


            if (
                !pdfDocument ||
                currentPage >= totalPages
            ) {

                return;
            }


            currentPage++;


            selectedText = "";


            window
                .getSelection()
                ?.removeAllRanges();


            updateSelectedText();


            await renderCurrentPage();


        }
    );


    // =====================================================
    // PREVIOUS PAGE
    // =====================================================

    prevPageButton.addEventListener(
        "click",
        async () => {


            if (
                !pdfDocument ||
                currentPage <= 1
            ) {

                return;
            }


            currentPage--;


            selectedText = "";


            window
                .getSelection()
                ?.removeAllRanges();


            updateSelectedText();


            await renderCurrentPage();


        }
    );


    // =====================================================
    // PAGE CONTROLS
    // =====================================================

    function updatePageControls() {


        pageInfo.textContent =
            `Pagina ${currentPage} / ${totalPages}`;


        prevPageButton.disabled =
            currentPage <= 1;


        nextPageButton.disabled =
            currentPage >= totalPages;

    }


    // =====================================================
    // TEXT SELECTION
    // =====================================================

    document.addEventListener(
        "mouseup",
        () => {


            const selection =
                window.getSelection();


            if (!selection) {

                return;
            }


            if (
                selection.rangeCount === 0
            ) {

                return;
            }


            const rawText =
                selection.toString();


            if (!rawText) {

                return;
            }


            /*
             * Verificăm originea selecției.
             */

            let anchor =
                selection.anchorNode;


            if (
                anchor &&
                anchor.nodeType ===
                Node.TEXT_NODE
            ) {

                anchor =
                    anchor.parentElement;

            }


            if (
                !anchor
            ) {

                return;
            }


            const textLayer =
                anchor.closest(
                    ".textLayer"
                );


            /*
             * Dacă nu este text layer,
             * ignorăm selecția.
             *
             * Asta înseamnă că imaginile,
             * canvas-ul și graficele nu
             * devin tag-uibile.
             */

            if (
                !textLayer
            ) {

                return;
            }


            /*
             * Curățăm inteligent spațiile.
             *
             * Nu folosim pur și simplu
             * replace(/\s+/g, " "), deoarece
             * selecțiile PDF pot conține
             * newline-uri artificiale.
             */

            const cleaned =
                normalizeSelectedText(
                    rawText
                );


            if (!cleaned) {

                return;
            }


            selectedText =
                cleaned;


            updateSelectedText();

        }
    );


    // =====================================================
    // NORMALIZARE SELECȚIE
    // =====================================================

    function normalizeSelectedText(text) {


        return text

            // CRLF / CR → LF
            .replace(
                /\r\n?/g,
                "\n"
            )

            /*
             * Spațiile multiple din interior
             * devin un singur spațiu.
             */

            .replace(
                /[ \t]+/g,
                " "
            )

            /*
             * Eliminăm spațiile de la
             * începutul și sfârșitul
             * fiecărei linii.
             */

            .replace(
                / *\n */g,
                "\n"
            )

            /*
             * Dacă PDF.js introduce mai multe
             * rânduri goale consecutiv,
             * le reducem.
             */

            .replace(
                /\n{3,}/g,
                "\n\n"
            )

            .trim();

    }


    // =====================================================
    // UPDATE SELECTED TEXT
    // =====================================================

    function updateSelectedText() {


        if (!selectedText) {


            selectedTextBox.textContent =
                "Selectează textul din PDF.";


            selectedTextBox.classList.add(
                "no-selection"
            );


            return;
        }


        selectedTextBox.textContent =
            selectedText;


        selectedTextBox.classList.remove(
            "no-selection"
        );

    }


    // =====================================================
    // CLEAR SELECTION
    // =====================================================

    clearSelectionButton.addEventListener(
        "click",
        () => {


            selectedText = "";


            window
                .getSelection()
                ?.removeAllRanges();


            updateSelectedText();

        }
    );


    // =====================================================
    // TAG BUTTONS
    // =====================================================

    document
        .querySelectorAll(".tag-button")
        .forEach(
            button => {


                button.addEventListener(
                    "click",
                    () => {


                        const tag =
                            button.dataset.tag;


                        addTaggedItem(
                            tag
                        );

                    }
                );

            }
        );


    // =====================================================
    // ADD TAG
    // =====================================================

    function addTaggedItem(tag) {


        if (!selectedText) {


            alert(
                "Selectează mai întâi textul din PDF."
            );


            return;
        }


        taggedItems.push({

            id:
                Date.now() +
                Math.random(),

            tag:
                tag,

            text:
                selectedText,

            page:
                currentPage

        });


        selectedText = "";


        window
            .getSelection()
            ?.removeAllRanges();


        updateSelectedText();

        updateTaggedList();

        updateXml();

    }


    // =====================================================
    // TAGGED LIST
    // =====================================================

    function updateTaggedList() {


        taggedList.innerHTML = "";


        if (
            taggedItems.length === 0
        ) {


            taggedList.innerHTML =
                `
                <div class="empty">
                    Nu există încă elemente taguite.
                </div>
                `;


            return;
        }


        taggedItems.forEach(
            (item, index) => {


                const element =
                    document.createElement(
                        "div"
                    );


                element.className =
                    "tagged-item";


                element.innerHTML =
                    `
                    <div class="tagged-header">

                        <span class="tag-name">
                            &lt;${escapeHtml(item.tag)}&gt;
                        </span>

                        <span class="tag-number">
                            #${index + 1}
                            · Pag. ${item.page}
                        </span>

                    </div>

                    <div class="tagged-text">
                        ${escapeHtml(item.text)}
                    </div>

                    <div class="item-actions">

                        <button
                            class="small secondary"
                            data-action="up"
                        >
                            ↑
                        </button>

                        <button
                            class="small secondary"
                            data-action="down"
                        >
                            ↓
                        </button>

                        <button
                            class="small danger"
                            data-action="delete"
                        >
                            Șterge
                        </button>

                    </div>
                    `;


                // ========================================
                // UP
                // ========================================

                element
                    .querySelector(
                        '[data-action="up"]'
                    )
                    .disabled =
                    index === 0;


                element
                    .querySelector(
                        '[data-action="up"]'
                    )
                    .addEventListener(
                        "click",
                        () => {

                            moveItem(
                                index,
                                index - 1
                            );

                        }
                    );


                // ========================================
                // DOWN
                // ========================================

                element
                    .querySelector(
                        '[data-action="down"]'
                    )
                    .disabled =
                    index ===
                    taggedItems.length - 1;


                element
                    .querySelector(
                        '[data-action="down"]'
                    )
                    .addEventListener(
                        "click",
                        () => {

                            moveItem(
                                index,
                                index + 1
                            );

                        }
                    );


                // ========================================
                // DELETE
                // ========================================

                element
                    .querySelector(
                        '[data-action="delete"]'
                    )
                    .addEventListener(
                        "click",
                        () => {


                            taggedItems.splice(
                                index,
                                1
                            );


                            updateTaggedList();

                            updateXml();

                        }
                    );


                taggedList.appendChild(
                    element
                );

            }
        );

    }


    // =====================================================
    // MOVE ITEM
    // =====================================================

    function moveItem(
        fromIndex,
        toIndex
    ) {


        if (
            toIndex < 0 ||
            toIndex >= taggedItems.length
        ) {

            return;
        }


        const item =
            taggedItems.splice(
                fromIndex,
                1
            )[0];


        taggedItems.splice(
            toIndex,
            0,
            item
        );


        updateTaggedList();

        updateXml();

    }


    // =====================================================
    // XML ESCAPE
    // =====================================================

    function escapeXml(text) {


        return text

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&apos;"
            );

    }


    // =====================================================
    // HTML ESCAPE
    // =====================================================

    function escapeHtml(text) {


        return text

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =====================================================
    // GENERATE XML
    // =====================================================

    function generateXml() {


        let xml =
`<?xml version="1.0" encoding="UTF-8"?>
<TaggedPDF-doc>
<Document>
<Article>
<Story>
`;


        taggedItems.forEach(
            item => {


                xml +=
`<${item.tag}>${escapeXml(item.text)}</${item.tag}>
`;

            }
        );


        xml +=
`</Story>
</Article>
</Document>
</TaggedPDF-doc>`;


        return xml;

    }


    // =====================================================
    // UPDATE XML
    // =====================================================

    function updateXml() {


        xmlPreview.value =
            generateXml();

    }


    // =====================================================
    // COPY XML
    // =====================================================

    copyXmlButton.addEventListener(
        "click",
        async () => {


            try {


                await navigator.clipboard.writeText(
                    xmlPreview.value
                );


                copyXmlButton.textContent =
                    "Copiat ✓";


                setTimeout(
                    () => {

                        copyXmlButton.textContent =
                            "Copiază XML";

                    },
                    1500
                );


            } catch (error) {


                alert(
                    "Nu am putut copia XML-ul."
                );

            }

        }
    );


    // =====================================================
    // DOWNLOAD XML
    // =====================================================

    downloadXmlButton.addEventListener(
        "click",
        () => {


            const xml =
                generateXml();


            const blob =
                new Blob(
                    [xml],
                    {
                        type:
                            "application/xml;charset=utf-8"
                    }
                );


            const url =
                URL.createObjectURL(
                    blob
                );


            const link =
                document.createElement(
                    "a"
                );


            link.href =
                url;


            link.download =
                "tagged-document.xml";


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();


            URL.revokeObjectURL(
                url
            );

        }
    );


    // =====================================================
    // INITIAL XML
    // =====================================================

    updateXml();


</script>


</body>

</html>
